---
# If true, the FSM transitions are managed by an external tool
Managed: false

# If true and the FSM is self-managed, transitions should be triggered manually
StepByStep: true

# Change idle behaviour:
# - true: keep the current state
# - false: hold the last state until transition
IdleKeepState: false

# Where to look for state libraries
StatesLibraries:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@"

# Where to look for state files
StatesFiles:
  - "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
  - "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"

# If true, the state factory will be more verbose
VerboseStateFactory: false

# =============================================================================
# Additional robots
# =============================================================================

robots:
  ground:
    module: env/ground

# =============================================================================
# Constraints
# =============================================================================

collisions:
  - type: collision
    useMinimal: true

# =============================================================================
# State-estimation pipeline
# =============================================================================

ObserverPipelines:
  - name: Pipeline
    gui: true
    log: true
    observers:
      # Read joint positions and velocities
      - type: Encoder
        velocity: encoderVelocities

      # Floating-base state estimator for simulation
      - type: BodySensor
        update: true
        bodySensor: FloatingBase

      # External-force estimator disabled for now because the robot model
      # currently has no configured force sensors.
      #
      - type: ExternalForcesObserver
        update: true
        is_active: true
        estimation_method: MomentumObserver
        # estimation_method: MomentumObserver
        simulator_filter_cutoff_hz: 5.0
        residual_gain: 31.4159
        torque_source_type: CommandedTorque
        use_forces_from_ft_sensors: false

# =============================================================================
# FSM
# =============================================================================

states: {}

transitions:
  - [G1RLQPController_Initial, OK, G1RLQPController_acceleration, Strict]
  - [G1RLQPController_acceleration, OK, G1RLQPController_Initial, Strict]

init: G1RLQPController_acceleration
Plugins: [mc_joystick_plugin]

# =============================================================================
# RL policy configuration
# =============================================================================

# Fill these two paths immediately before launching the controller.
# Index 0: JointPositionAction policy; index 1: JointAccelerationAction policy.
policy_path:
  - "/home/raphaelbarrabes/workspace/src/G1RLQPController/policy/policy_pos_08_07.onnx"
  - "/home/raphaelbarrabes/workspace/src/G1RLQPController/policy/policy_acc_08_05.onnx"

position_policy_index: 0
acceleration_policy_index: 1

policy_common:
  - # The QP is mandatory for PostureTask::refAccel.
    use_QP: false 

    # MuJoCo timestep:
    # 0.0025 s × decimation 4 = policy period of 0.01 s.
    policy_step_size: 0.01
    physics_step_size: 0.0025

    # Weight of the PostureTask acceleration objective in the QP.
    # PostureTask Kp and Kd are set to zero in the C++ code.
    posture_weight: 10.0

    # Safety ratio applied to the acceleration policy:
    # 0.0 = policy runs but accelerations are not applied
    # 1.0 = full policy accelerations are applied
    acceleration_action_ratio: 1.0

    # Command observed by the policy:
    # [vx, vy, yaw_rate]
    velocity_command: [0.0, 0.0, 0.0]

    # -------------------------------------------------------------------------
    # Acceleration action scale
    #
    # qdd_command =
    #   acceleration_action_ratio
    #   × action_scale
    #   × raw_ONNX_action
    #
    # JointAccelerationActionCfg was trained with scale = 30.
    # -------------------------------------------------------------------------

    action_scale:
      left_hip_pitch_joint: 30.0
      left_hip_roll_joint: 30.0
      left_hip_yaw_joint: 30.0
      left_knee_joint: 30.0
      left_ankle_pitch_joint: 30.0
